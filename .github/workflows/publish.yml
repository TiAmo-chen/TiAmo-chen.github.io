name: Publish nano-blog to orangeheart.top

# 站点源码在公开仓库 TiAmo-chen/nano-blog；本仓库只存构建产物。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'          # 每天 UTC 22:00（北京时间 06:00）自动同步
  push:
    paths:
      - '.github/workflows/publish.yml'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检出源码仓库（公开）
        uses: actions/checkout@v4
        with:
          repository: TiAmo-chen/nano-blog
          ref: main
          path: src

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建静态站
        run: |
          python -m pip install -q -r src/requirements.txt
          python src/build.py --clean

      - name: 同步产物到仓库根目录
        run: |
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '.github' ! -name 'src' -exec rm -rf {} +
          cp -a src/public/. .

      - name: 提交并推送
        run: |
          git config user.name  "TiAmo-chen"
          git config user.email "xuan.chen@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "publish: nano-blog @ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi